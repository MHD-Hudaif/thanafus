<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Backdrop Slideshow - Slow Flowing Wind Animation</title>
    
    <!-- FontAwesome & GSAP -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #0f172a;
        }

        /* ----------------------------------------------------
           Backdrop Base and Slideshow Container
        ---------------------------------------------------- */
        .tv-backdrop {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #ffffff 0%, #fcfdfd 70%, #f8fafc 100%);
        }

        /* Grid floor perspective overlay */
        .cyber-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.012) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 5;
            pointer-events: none;
            opacity: 0.8;
            mask-image: radial-gradient(circle at center, black 50%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 50%, transparent 85%);
        }

        #flowCanvas {
            position: absolute;
            inset: 0;
            z-index: 6;
            width: 100%;
            height: 100%;
            display: block;
            opacity: 0.95;
            pointer-events: none;
        }

        /* ----------------------------------------------------
           Slideshow Control HUD
        ---------------------------------------------------- */
        .hud-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 40px;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
        }

        .team-indicator {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #475569;
            min-width: 140px;
            text-align: center;
            transition: color 0.4s ease;
        }

        /* Nav Dots */
        .nav-dots {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(15, 23, 42, 0.12);
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .dot-btn::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            transition: all 0.3s ease;
        }

        .dot-btn.active {
            background-color: var(--active-theme-color, #10b981);
            transform: scale(1.15);
        }

        .dot-btn.active::after {
            border-color: var(--active-theme-color, #10b981);
        }

        /* Auto-play Timer Indicator Line */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(15, 23, 42, 0.03);
            z-index: 15;
        }

        .progress-line {
            height: 100%;
            width: 0%;
            background-color: var(--active-theme-color, #10b981);
            transition: background-color 0.4s ease;
        }

        /* Top Info Tag */
        .info-pill {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(15, 23, 42, 0.06);
            padding: 8px 22px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-pill span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--active-theme-color, #10b981);
            animation: pulse-dot 1.5s infinite alternate;
        }

        @keyframes pulse-dot {
            from { transform: scale(0.85); opacity: 0.6; }
            to { transform: scale(1.25); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="tv-backdrop" style="--active-theme-color: #10b981;">
        <div class="cyber-grid"></div>
        <canvas id="flowCanvas"></canvas>
    </div>

    <!-- Info Banner -->
    <div class="info-pill" style="--active-theme-color: #10b981;">
        <span></span> Clean Wind Flowing Backdrop
    </div>

    <!-- Navigation Overlay -->
    <div class="hud-overlay">
        <div class="team-indicator" id="teamNameTag">القين (GREEN)</div>
        <div class="nav-dots" id="dotsWrapper">
            <button class="dot-btn active" data-target="0" title="Green Team"></button>
            <button class="dot-btn" data-target="1" title="Red Team"></button>
            <button class="dot-btn" data-target="2" title="Blue Team"></button>
            <button class="dot-btn" data-target="3" title="Yellow Team"></button>
        </div>
    </div>

    <!-- Bottom Progress Line -->
    <div class="progress-bar-container">
        <div class="progress-line" id="progressLine" style="--active-theme-color: #10b981;"></div>
    </div>

    <script>
        // Slideshow configuration
        const teamNameTag = document.getElementById('teamNameTag');
        const progressLine = document.getElementById('progressLine');
        const backdrop = document.querySelector('.tv-backdrop');
        const infoPill = document.querySelector('.info-pill');
        const dots = document.querySelectorAll('.dot-btn');

        let currentIdx = 0;
        const slideDuration = 6500; // 6.5 seconds per slide
        let autoplayTimer = null;
        let progressTween = null;

        const teamNames = {
            0: "القين (GREEN)",
            1: "اليقين (RED)",
            2: "الطين (BLUE)",
            3: "الفين (YELLOW)"
        };

        // Color palettes mapping for smoothly morphing particles & wind lines
        const slideColors = {
            0: { primary: '#10b981', r: 16, g: 185, b: 129 },   // Green
            1: { primary: '#f43f5e', r: 244, g: 63, b: 94 },    // Red
            2: { primary: '#3b82f6', r: 59, g: 130, b: 246 },   // Blue
            3: { primary: '#eab308', r: 234, g: 179, b: 8 }     // Yellow
        };

        function switchSlide(targetIdx) {
            if (targetIdx === currentIdx) return;
            
            // Deactivate current slide dot
            dots[currentIdx].classList.remove('active');

            // Activate new slide dot
            currentIdx = targetIdx;
            dots[currentIdx].classList.add('active');

            const activeColor = slideColors[currentIdx].primary;
            const activeName = teamNames[currentIdx];

            // Update UI Colors smoothly
            backdrop.style.setProperty('--active-theme-color', activeColor);
            infoPill.style.setProperty('--active-theme-color', activeColor);
            teamNameTag.textContent = activeName;

            // Trigger particle and wind line color transitions
            updateColorTargets(slideColors[currentIdx]);

            // Reset and restart autoplay loop
            resetAutoplay();
        }

        function resetAutoplay() {
            if (autoplayTimer) clearTimeout(autoplayTimer);
            if (progressTween) progressTween.kill();
            gsap.set(progressLine, { width: '0%' });

            progressTween = gsap.to(progressLine, {
                width: '100%',
                duration: slideDuration / 1000,
                ease: 'none'
            });

            autoplayTimer = setTimeout(() => {
                let nextIdx = (currentIdx + 1) % Object.keys(slideColors).length;
                switchSlide(nextIdx);
            }, slideDuration);
        }

        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const target = parseInt(dot.getAttribute('data-target'), 10);
                switchSlide(target);
            });
        });

        // Initialize progress line on load
        resetAutoplay();

        // ----------------------------------------------------
        // Canvas particle and flowing wind wave system
        // ----------------------------------------------------
        const canvas = document.getElementById('flowCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Global color state for lines and particles that interpolates smoothly
        let windColor = {
            r: slideColors[0].r,
            g: slideColors[0].g,
            b: slideColors[0].b,
            targetR: slideColors[0].r,
            targetG: slideColors[0].g,
            targetB: slideColors[0].b
        };

        function updateColorTargets(palette) {
            windColor.targetR = palette.r;
            windColor.targetG = palette.g;
            windColor.targetB = palette.b;

            particles.forEach(p => p.setTarget(palette));
        }

        // Soft micro-particles (Slowed down to match wind speed)
        class MorphedParticle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                this.size = Math.random() * 3 + 1.2;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = -Math.random() * 0.12 - 0.06; // Ultra slow upward float
                this.alpha = Math.random() * 0.22 + 0.12;
                
                const currentPalette = slideColors[currentIdx];
                this.r = currentPalette.r + (Math.random() - 0.5) * 20;
                this.g = currentPalette.g + (Math.random() - 0.5) * 20;
                this.b = currentPalette.b + (Math.random() - 0.5) * 20;

                this.targetR = this.r;
                this.targetG = this.g;
                this.targetB = this.b;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.0006;

                // Interpolate colors smoothly
                this.r += (this.targetR - this.r) * 0.05;
                this.g += (this.targetG - this.g) * 0.05;
                this.b += (this.targetB - this.b) * 0.05;

                if (this.y < -this.size || this.alpha <= 0) {
                    this.reset(false);
                }
            }

            draw() {
                const colorStr = `rgb(${Math.round(this.r)}, ${Math.round(this.g)}, ${Math.round(this.b)})`;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = colorStr;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            setTarget(palette) {
                this.targetR = palette.r + (Math.random() - 0.5) * 25;
                this.targetG = palette.g + (Math.random() - 0.5) * 25;
                this.targetB = palette.b + (Math.random() - 0.5) * 25;
            }
        }

        const particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push(new MorphedParticle());
        }

        // Draw Flowing Silk Wind Lines (Slower and more visible)
        function drawWindFlow() {
            // Time multiplier reduced from 0.0006 to 0.00015 for slower movement
            const time = Date.now() * 0.00015;
            const linesCount = 5;

            // Interpolate global wind color towards slide target color
            windColor.r += (windColor.targetR - windColor.r) * 0.05;
            windColor.g += (windColor.targetG - windColor.g) * 0.05;
            windColor.b += (windColor.targetB - windColor.b) * 0.05;

            const baseColor = `rgb(${Math.round(windColor.r)}, ${Math.round(windColor.g)}, ${Math.round(windColor.b)})`;

            for (let i = 0; i < linesCount; i++) {
                ctx.save();
                
                // Vertical position spacing
                const yBase = (height / (linesCount + 1)) * (i + 1);

                // Horizontal gradient fade at edges - Peak opacity increased from 0.35 to 0.75 for maximum visibility
                const lineGrad = ctx.createLinearGradient(0, 0, width, 0);
                lineGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                lineGrad.addColorStop(0.15, `rgba(${Math.round(windColor.r)}, ${Math.round(windColor.g)}, ${Math.round(windColor.b)}, 0.25)`);
                lineGrad.addColorStop(0.5, `rgba(${Math.round(windColor.r)}, ${Math.round(windColor.g)}, ${Math.round(windColor.b)}, 0.75)`);
                lineGrad.addColorStop(0.85, `rgba(${Math.round(windColor.r)}, ${Math.round(windColor.g)}, ${Math.round(windColor.b)}, 0.25)`);
                lineGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.strokeStyle = lineGrad;
                // Line width increased from 1.5/3 to 2.5/4.5 for more visibility
                ctx.lineWidth = i % 2 === 0 ? 4.5 : 2.5; 
                
                // Neon blur glow blur size increased from 8 to 15
                ctx.shadowColor = baseColor;
                ctx.shadowBlur = 15;

                ctx.beginPath();

                const step = 25;
                for (let x = 0; x <= width + step; x += step) {
                    // sine waves for organic wind movement
                    const wave1 = Math.sin(x * 0.0025 + time * 1.5 + i * 1.7) * 45;
                    const wave2 = Math.cos(x * 0.005 - time * 0.8 + i * 2.3) * 20;
                    const wave3 = Math.sin(x * 0.001 + time * 0.4) * 30;

                    const y = yBase + wave1 + wave2 + wave3;

                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.stroke();
                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw flowing wind ribbons
            drawWindFlow();
            
            // Draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
