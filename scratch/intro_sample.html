<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Video & Animation Preview</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
    
    <!-- GSAP for Animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Fullscreen Stage Container */
        .stage-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hardware Accelerated Fullscreen Background Video */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 108%; /* Match current crop setup */
            object-fit: cover;
            transform: translate3d(0, -8%, 0); /* GPU Layer Promotion */
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            z-index: 1;
        }

        /* Overlay Layer for Logos */
        .overlay-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4); /* Dark screen overlay */
        }

        /* Logo Wrapper Styles */
        .logo-container {
            position: absolute;
            text-align: center;
            opacity: 0;
            transform: scale(0.92);
            will-change: opacity, transform;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Decorative glowing ring behind logos */
        .glow-ring {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, rgba(16, 185, 129, 0) 70%);
            z-index: -1;
            filter: blur(10px);
        }

        /* Placeholder Logo Graphic */
        .logo-graphic {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
            margin-bottom: 20px;
            color: white;
            font-size: 48px;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .logo-graphic.gold {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.35);
        }

        /* Logo Text Styles */
        .logo-title {
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            font-family: 'Outfit', sans-serif;
        }

        .logo-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* Controls Panel (Helper UI for testing) */
        .controls-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .control-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .control-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <!-- Fullscreen Video Element -->
        <video class="video-background" id="introVideoPlayer" autoplay loop muted playsinline preload="auto">
            <source src="../assets/videos/Intro.mp4" type="video/mp4">
        </video>

        <!-- Overlays -->
        <div class="overlay-layer">
            
            <!-- 1. Thanafus Logo Container -->
            <div class="logo-container" id="introThanafusLogo">
                <div class="glow-ring"></div>
                <div class="logo-graphic">T</div>
                <h1 class="logo-title">Thanafus</h1>
                <p class="logo-subtitle">Active Competition</p>
            </div>

            <!-- 2. Kauzariyya Logo Container -->
            <div class="logo-container" id="introKauzariyyaLogo">
                <div class="glow-ring" style="background: radial-gradient(circle, rgba(251, 191, 36, 0.2) 0%, rgba(251, 191, 36, 0) 70%);"></div>
                <div class="logo-graphic gold">K</div>
                <h1 class="logo-title" style="color: #fbbf24;">Kauzariyya</h1>
                <p class="logo-subtitle">Digital Musabaqa</p>
            </div>

        </div>

        <!-- Helper UI Controls -->
        <div class="controls-panel">
            <button class="control-btn" onclick="triggerTimeline()">Replay Animation</button>
            <button class="control-btn secondary" onclick="toggleMute()">Toggle Audio</button>
        </div>
    </div>

    <script>
        let introTimeline = null;
        const videoEl = document.getElementById('introVideoPlayer');

        function triggerTimeline() {
            const thanafusLogo = document.getElementById('introThanafusLogo');
            const kauzariyyaLogo = document.getElementById('introKauzariyyaLogo');

            if (!thanafusLogo || !kauzariyyaLogo) return;

            // Reset video to start
            if (videoEl) {
                videoEl.currentTime = 0;
                videoEl.play().catch(() => {});
            }

            // Kill any active timeline
            if (introTimeline) {
                introTimeline.kill();
            }

            // Reset styles
            gsap.set([thanafusLogo, kauzariyyaLogo], { opacity: 0, scale: 0.92 });

            // Create Timeline matching the production setup
            introTimeline = gsap.timeline();

            // 1. Fade in Thanafus logo in center
            introTimeline.to(thanafusLogo, {
                opacity: 1,
                scale: 1,
                duration: 1.2,
                ease: 'power2.out'
            })
            // Hold for 2.2s then fade out
            .to(thanafusLogo, {
                opacity: 0,
                scale: 1.06,
                duration: 0.8,
                ease: 'power2.in',
                delay: 2.2
            })
            // 2. Fade in Kauzariyya logo in center
            .to(kauzariyyaLogo, {
                opacity: 1,
                scale: 1,
                duration: 1.2,
                ease: 'power2.out'
            }, '+=0.2')
            // Hold Kauzariyya logo for 2.5s and then fade out
            .to(kauzariyyaLogo, {
                opacity: 0,
                scale: 1.06,
                duration: 0.8,
                ease: 'power2.in',
                delay: 2.5
            });
        }

        function toggleMute() {
            if (videoEl) {
                videoEl.muted = !videoEl.muted;
            }
        }

        // Start timeline on page load
        window.addEventListener('load', () => {
            triggerTimeline();
        });
    </script>
</body>
</html>
